<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping List</title>
  <style>
    :root { --bg: #ffffff; --text: #111113; --muted: #60646c; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #ffffff; --muted: #b0b4ba; } }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); text-align: center;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>🛒 Shopping List</h1>
    <p>Make a shopping list and share it with a link. Everyone can add and tick off items.</p>
  </main>
</body>
</html>
